<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --paddle: #e2e8f0;
      --ball: #f8fafc;
      --line: rgba(255,255,255,0.2);
      --text: #f8fafc;
      --accent: #38bdf8;
      --shadow: rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .game-wrap {
      position: relative;
      width: 820px;
      max-width: 90vw;
      text-align: center;
    }

    .scoreboard {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      color: var(--text);
      user-select: none;
    }

    canvas {
      width: 100%;
      height: auto;
      background: var(--bg);
      border: 3px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: block;
      position: relative;
      z-index: 1;
    }

    .start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.72);
      border-radius: 10px;
      z-index: 2;
      backdrop-filter: blur(2px);
    }

    .start-content {
      text-align: center;
      padding: 30px 40px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      box-shadow: 0 12px 30px var(--shadow);
    }

    .title {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 16px;
      color: #cbd5e1;
      font-size: 1rem;
    }

    .hint {
      margin: 0;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <span id="leftScore">0</span> : <span id="rightScore">0</span>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div id="startScreen" class="start-screen">
      <div class="start-content">
        <h1 class="title">Pong</h1>
        <p class="subtitle">Move mouse or use ↑ ↓ to control the left paddle.</p>
        <p class="hint">Press Space to Start</p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");
    const startScreen = document.getElementById("startScreen");

    const paddleWidth = 14;
    const paddleHeight = 90;
    const paddleSpeed = 6;
    const ballRadius = 10;

    let leftScore = 0;
    let rightScore = 0;
    let gameStarted = false;

    const leftPaddle = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: paddleSpeed
    };

    const rightPaddle = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.4
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: ballRadius,
      vx: 5,
      vy: 2,
      speed: 5
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false
    };

    function updateScores() {
      leftScoreEl.textContent = leftScore;
      rightScoreEl.textContent = rightScore;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * 1.2 - 0.6);
      ball.vx = direction * (ball.speed + 0.6);
      ball.vy = angle * 6;
    }

    function moveLeftPaddle() {
      if (keys.ArrowUp) {
        leftPaddle.y -= leftPaddle.speed;
      }
      if (keys.ArrowDown) {
        leftPaddle.y += leftPaddle.speed;
      }
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    }

    function moveRightPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;
      rightPaddle.y += diff * 0.12;
      rightPaddle.y = Math.max(0, Math.min(canvas.height - rightPaddle.height, rightPaddle.y));
    }

    function wallCollision() {
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision(paddle) {
      const withinPaddleX =
        ball.x + ball.radius >= paddle.x &&
        ball.x - ball.radius <= paddle.x + paddle.width;

      const withinPaddleY =
        ball.y >= paddle.y &&
        ball.y <= paddle.y + paddle.height;

      if (withinPaddleX && withinPaddleY) {
        const relativeIntersect = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const bounceAngle = relativeIntersect * (Math.PI / 3);
        const direction = ball.x < canvas.width / 2 ? 1 : -1;
        const speed = Math.min(11, Math.hypot(ball.vx, ball.vy) + 0.35);

        ball.vx = direction * speed * Math.cos(bounceAngle);
        ball.vy = speed * Math.sin(bounceAngle);
      }
    }

    function updateBall() {
      if (!gameStarted) return;

      ball.x += ball.vx;
      ball.y += ball.vy;

      wallCollision();

      if (
        ball.x - ball.radius <= leftPaddle.x + leftPaddle.width &&
        ball.x + ball.radius >= leftPaddle.x &&
        ball.y > leftPaddle.y &&
        ball.y < leftPaddle.y + leftPaddle.height
      ) {
        handlePaddleCollision(leftPaddle);
      }

      if (
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x - ball.radius <= rightPaddle.x + rightPaddle.width &&
        ball.y > rightPaddle.y &&
        ball.y < rightPaddle.y + rightPaddle.height
      ) {
        handlePaddleCollision(rightPaddle);
      }

      if (ball.x - ball.radius < 0) {
        rightScore++;
        updateScores();
        resetBall(1);
      } else if (ball.x + ball.radius > canvas.width) {
        leftScore++;
        updateScores();
        resetBall(-1);
      }
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#f8fafc";
      ctx.fill();
      ctx.closePath();
    }

    function drawCenterLine() {
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.setLineDash([10, 12]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawCenterLine();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    function gameLoop() {
      if (gameStarted) {
        moveLeftPaddle();
        moveRightPaddle();
        updateBall();
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      gameStarted = true;
      startScreen.classList.add("hidden");
      resetBall(1);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === " " && !gameStarted) {
        event.preventDefault();
        startGame();
        return;
      }

      if (event.key in keys) {
        keys[event.key] = true;
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key in keys) {
        keys[event.key] = false;
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = ((event.clientY - rect.top) / rect.height) * canvas.height;
      leftPaddle.y = mouseY - leftPaddle.height / 2;
      leftPaddle.y = Math.max(0, Math.min(canvas.height - leftPaddle.height, leftPaddle.y));
    });

    updateScores();
    resetBall(1);
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
